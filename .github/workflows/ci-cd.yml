name: Backend CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haccp_user
          POSTGRES_PASSWORD: haccp_password
          POSTGRES_DB: haccp_control_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U haccp_user -d haccp_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://haccp_user:haccp_password@localhost:5432/haccp_control_test
      TEST_DATABASE_URL: postgresql+asyncpg://haccp_user:haccp_password@localhost:5432/haccp_control_test
      ENVIRONMENT: local
      JWT_SECRET_KEY: ci-local-secret-for-tests-only-32chars
      PLATFORM_ADMIN_KEY: ci-platform-admin-key-for-tests-only
      JWT_ALGORITHM: HS256
      ESTABLISHMENT_ACCESS_TOKEN_EXPIRE_HOURS: "12"
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
      AWS_REGION: eu-west-3
      AWS_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: haccp-test-documents
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff – format check
        run: uv run ruff format --check app alembic tests

      - name: Ruff – lint check
        run: uv run ruff check --output-format=github app alembic tests

      - name: Run mypy
        run: uv run mypy app

      - name: Run pytest
        run: uv run pytest

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write # Indispensable pour pousser sur GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automatique GitHub

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/haccp-api:latest
            ghcr.io/${{ github.repository_owner }}/haccp-api:${{ github.sha }}
