global:
  scrape_interval: 15s
  evaluation_interval: 15s

# AlertManager endpoint for firing alerts.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load alert rules from the rules file.
rule_files:
  - /etc/prometheus/prometheus_rules.yml

scrape_configs:
  - job_name: "haccp-api"
    metrics_path: /metrics
    # Uncomment and set the token below if METRICS_TOKEN is configured on the API.
    # authorization:
    #   credentials: <your-METRICS_TOKEN-value>
    static_configs:
      - targets: ["api:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
